<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Shift helps you plan, afford, and complete your move to a new city or country." />
  <title>Shift — From “I want to move” to “I’m ready.”</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <button class="brand" data-go="landing" aria-label="Shift home">
        <span class="brand-mark">S</span>
        <span>Shift</span>
      </button>
      <div class="top-actions">
        <button class="ghost-btn" id="demoReset">Reset demo</button>
        <button class="profile-chip" id="profileChip">AA</button>
      </div>
    </header>

    <main id="app"></main>
  </div>

  <template id="landing-template">
    <section class="landing page-enter">
      <div class="hero-copy">
        <span class="eyebrow">Move with clarity</span>
        <h1>From <em>“I want to move”</em><br>to <em>“I’m ready.”</em></h1>
        <p>Shift turns an international move into one clear plan across money, documents, logistics, and your first 90 days.</p>
      </div>

      <div class="route-card">
        <div class="route-grid">
          <label>
            <span>Moving from</span>
            <input id="fromInput" value="Lagos, Nigeria" autocomplete="off" />
          </label>
          <div class="route-arrow">→</div>
          <label>
            <span>Moving to</span>
            <input id="toInput" value="Toronto, Canada" autocomplete="off" />
          </label>
        </div>
        <label class="date-row">
          <span>Target move</span>
          <input id="dateInput" type="month" value="2027-08" />
        </label>
        <button class="primary-btn wide" id="buildPlanBtn">Build my move plan <span>→</span></button>
        <p class="microcopy">No account needed to explore your first plan.</p>
      </div>

      <div class="proof-strip">
        <article><strong>Know what you need.</strong><span>Personalized documents, deadlines, and logistics.</span></article>
        <article><strong>Know what it may cost.</strong><span>A living Move Fund that gets more accurate as you go.</span></article>
        <article><strong>Know what to do next.</strong><span>Three clear priorities instead of fifty open tabs.</span></article>
      </div>
    </section>
  </template>

  <template id="onboarding-template">
    <section class="onboarding page-enter">
      <div class="onboarding-head">
        <span class="step-label" id="stepLabel">Step 1 of 4</span>
        <div class="progress-track"><span id="progressFill"></span></div>
      </div>
      <div class="question-card" id="questionCard"></div>
    </section>
  </template>

  <template id="dashboard-template">
    <section class="product-layout page-enter">
      <aside class="side-nav">
        <div class="move-mini">
          <span class="eyebrow">Your move</span>
          <strong id="sideDestination">Toronto</strong>
          <span id="sideRoute">Lagos → Toronto</span>
        </div>
        <nav>
          <button class="nav-item active" data-view="overview">Overview</button>
          <button class="nav-item" data-view="fund">Move Fund</button>
          <button class="nav-item" data-view="journey">Journey</button>
          <button class="nav-item" data-view="documents">Documents</button>
        </nav>
        <div class="ask-card">
          <span>Ask Shift</span>
          <p>“What should I focus on this month?”</p>
          <button class="secondary-btn" id="askShiftBtn">Ask about my move</button>
        </div>
      </aside>
      <section class="content" id="dashboardContent"></section>
    </section>
  </template>

  <script src="app.js"></script>
</body>
</html>
